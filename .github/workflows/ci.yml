# SPDX-FileCopyrightText: 2026 Chey Rasmussen
#
# The whole suite, on every push and every pull request.
#
# An extraction requirement, and the reason is specific: the tests are the only
# automated check that the authoring stack survived the move, and they encode the
# invariants the teaching loop runs on — a machine may not overwrite a human, and
# machine output may never re-enter as evidence. A suite that only runs when
# someone remembers to run it does not enforce anything.
#
# No browser, no database, no network. `node --test` on the sources with the
# `source` export condition, so cross-package imports resolve without a build
# step; the build and the typechecks run separately because they check different
# things.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every package plus the rectifier: 177 tests, no dependencies.
      - name: Test
        run: pnpm test

      # The packages, as a project-reference build. This is also what produces
      # the dist/ the browser-side harness loads.
      - name: Build
        run: pnpm run build

      # Two typechecks, because tools/ is outside the workspace projects and
      # would otherwise never be checked at all — which is exactly how a build
      # script rots.
      - name: Typecheck
        run: pnpm run typecheck

      # core, patterns and stage must compile AND RUN with three.js absent.
      # Cheap to verify, expensive to lose: it is what keeps a WebGL2 or
      # custom-element adapter an addition rather than a rewrite — and it is
      # what makes "one renderer, any number of cards" an architecture every
      # adapter inherits rather than a three.js feature.
      - name: Renderer independence
        run: node tools/check-independence.mjs

      # The corpus reads: canon files load and validate against the stamped
      # contract, sidecars normalise, mask rasters are canonical.
      - name: Data receipt
        run: node --conditions source tools/parity/data-receipt.mjs

      # The corpus manifest is a BUILD STEP of the hosted editor, so a
      # committed one that no longer matches data/ would ship a site whose
      # contribution filters quietly disagree with the corpus they describe.
      # `--check` builds it in memory and fails if the committed file differs.
      - name: Corpus manifest is current
        run: node --conditions source tools/build-corpus-manifest.mts --check

      # The editor's own typecheck. It is a separate tsconfig (DOM lib, JSX,
      # the `source` customCondition) and `pnpm typecheck` above does not see
      # it, which is exactly how a front end rots while CI stays green.
      - name: Typecheck the editor
        run: pnpm --filter foilkit-editor exec tsc --noEmit -p tsconfig.json

      # A BROKEN WORKFLOW DOES NOT FAIL — it does not RUN, and a job that never
      # ran looks exactly like a job that had nothing to do. `pr-evidence.yml`
      # is the render evidence AND the GLSL compile gate, so a silently inert
      # one would let a shader that does not link reach `main` with every check
      # on the pull request green. This is the offline half; `actionlint` in the
      # job below is the real parser.
      - name: Workflow structure
        run: pnpm run workflows

  # actionlint, in its OWN JOB so a syntax error in a workflow is reported as a
  # syntax error in a workflow rather than as "the test job failed". It parses
  # the YAML properly, type-checks every `${{ }}` expression and shellchecks
  # every `run:` block — which is the class of mistake that otherwise only shows
  # up on a runner, at the moment somebody needed the job to work.
  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # A SEPARATE JOB on purpose. It needs a browser, a built dist/ and a server,
  # and it takes minutes rather than seconds — hanging that off the fast suite
  # would make every contributor wait for a GPU-less Chromium to finish before
  # learning a unit test failed. Run in parallel, gate the same.
  acceptance:
    name: stage acceptance (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The demo is plain ESM behind an import map and loads packages/*/dist —
      # there is no bundler in this loop either.
      - name: Build
        run: pnpm run build

      # Playwright is deliberately NOT a repository dependency: the library and
      # the unit suite need none, and this is an instrument rather than a gate
      # on `pnpm install`. It is installed here, into a directory of its own,
      # and reached through PW_ROOT — the same contract the parity harness uses.
      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm i --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium

      # Server and run in ONE step: a background process started in one step and
      # used by the next is a race the runner does not owe anybody.
      #
      # SwiftShader inside, so the run does not depend on a GPU the runner does
      # not have. The ladder is forced with the demo's synthetic-load knob
      # rather than by hoping the machine is slow, which is also what makes it
      # reproducible.
      - name: Acceptance
        run: |
          node tools/parity/serve.mjs --page apps/demo/index.html --port 5200 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          # `_` rather than `i`: the counter is never read, and shellcheck says
          # so (SC2034) through actionlint. Naming an unused variable after
          # something is how the next person spends a minute looking for the
          # use that is not there.
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5200/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5200/ > /dev/null || { echo 'demo server never came up' >&2; exit 1; }
          node apps/demo/acceptance.mjs --cards 300
        env:
          PW_ROOT: ${{ runner.temp }}/pw/package.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-acceptance
          path: apps/demo/.acceptance/
          # The directory is dot-prefixed, and upload-artifact skips hidden
          # files by default — so without this the artifact is empty exactly
          # when it is needed, which is on a failure.
          include-hidden-files: true
          if-no-files-found: warn

  # The hosted editor, driven end to end over its BUILT OUTPUT against a
  # fixture bake. A separate job for the same reason the stage acceptance is
  # one: it needs a browser and minutes, and a unit-test failure should not
  # wait behind a GPU-less Chromium.
  #
  # It runs against the FIXTURE catalog, never the real one — the real bake
  # needs a Postgres connection this runner does not have and should not want.
  # The corpus half (masks, canon, window geometry) is the real committed data,
  # which is what makes the provenance and conflict assertions meaningful.
  editor:
    name: editor acceptance (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm run build

      - name: Fixture bake + corpus manifest
        run: |
          node --conditions source tools/bake-fixture.mts --out data/fixture-bake
          node --conditions source tools/build-corpus-manifest.mts

      - name: Build the editor
        run: pnpm --filter foilkit-editor run build
        env:
          FOILKIT_BAKE: fixture

      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm i --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium

      # Browse the queue, open a card, draw a stroke, stage it, reload, export,
      # re-import, and move upstream under it until the conflict UI appears.
      - name: Editor acceptance
        run: node apps/editor/e2e/run.mjs
        env:
          PW_ROOT: ${{ runner.temp }}/pw/package.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-acceptance
          path: |
            apps/editor/e2e/last-run.json
            apps/editor/e2e/failure.png
          if-no-files-found: warn

  # THE DEPLOY ARTIFACT, built and booted. A separate job because it is the
  # only check that looks at what actually ships.
  #
  # It exists because the first production deploy answered
  # FUNCTION_INVOCATION_FAILED on every route while every test in this
  # repository passed. The code was right and the packaging was not, and
  # nothing that imports the TypeScript source can tell the difference.
  deploy-artifact:
    name: deploy artifact (build + boot every function)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exactly what vercel.json's buildCommand runs. If this fails here, it
      # fails there.
      - name: Build the deployment
        run: pnpm run build:vercel

      # Boots every built .func with an EMPTY environment, asserts /api/image
      # needs none at all, and asserts every other route degrades to a NAMED
      # 503 rather than a 500 or a crash. `--no-network` because the runner
      # should not depend on a volunteer CDN to pass CI; the one real upstream
      # fetch is a local-only check.
      - name: Boot and exercise every function
        run: node --conditions source tools/verify-functions.mts --no-network

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vercel-output-config
          path: .vercel/output/config.json
          if-no-files-found: warn

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The license split is per FILE and it is machine-readable. Removing a
      # REUSE.toml glob silently un-licenses a whole corpus, which is not a
      # formatting change — so it is checked rather than trusted.
      - uses: fsfe/reuse-action@v5
